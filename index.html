
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLITZ PRIVATE</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d18;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(85%, 340px);
      padding: 28px;
      border: 1px solid #287dff;
      border-radius: 18px;
      background: #111a2b;
      text-align: center;
      box-sizing: border-box;
    }
    h1 { color: #62a4ff; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { background: #080d18; color: white; border: 1px solid #50617a; }
    button { background: #287dff; color: white; border: 0; font-weight: bold; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>BLITZ PRIVATE</h1>
    <p>Enter your password to continue</p>
    <form id="login">
      <input id="password" type="password" placeholder="Enter password" required>
      <button type="submit">UNLOCK</button>
    </form>
    <p id="message"></p>
  </main>
  <script>
    const passwords = ["BLITZ123", "TEST456", "PDF789"];
    document.getElementById("login").addEventListener("submit", function(event) {
      event.preventDefault();
      const entered = document.getElementById("password").value;
      const message = document.getElementById("message");
      if (passwords.includes(entered)) {
        message.textContent = "Demo unlocked! This is a test page, not a real PDF.";
      } else {
        message.textContent = "Incorrect password. Try again.";
      }
    });
  </script>
</body>
</html>
